[project]
name = "sia-sim"
version = "0.1.0"
description = "Deterministic 100 Hz simulation testbed for SIA Core validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "polars>=1.0.0",
    "pyarrow>=18.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sia_sim"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
